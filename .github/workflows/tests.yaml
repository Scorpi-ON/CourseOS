name: pytest tests
permissions:
  contents: read
  pull-requests: read

on:
  push:
    paths:
      - ".github/workflows/tests.yaml"
      - "**.py"
  pull_request:
    paths:
      - ".github/workflows/tests.yaml"
      - "**.py"

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install deps
        working-directory: fs
        run: uv tool install pytest

      - name: Run pytest
        working-directory: fs
        run: pytest CourseOS/tests
