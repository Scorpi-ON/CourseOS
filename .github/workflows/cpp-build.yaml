name: C++ build
permissions:
  contents: read
  pull-requests: read

on:
  push:
    paths:
      - ".github/workflows/cpp-build.yaml"
      - "**.cpp"
  pull_request:
    paths:
      - ".github/workflows/cpp-build.yaml"
      - "**.cpp"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Run g++
        working-directory: processes
        run: find . -type f -name "*.cpp" -exec g++ {} \;
